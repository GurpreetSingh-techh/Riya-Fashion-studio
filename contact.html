<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Riya Fashion Studio</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .contact-section {
            max-width: 750px;
            margin: 60px auto;
            padding: 35px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .contact-section h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        .contact-section p {
            text-align: center;
            margin-bottom: 25px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .contact-form textarea {
            resize: vertical;
        }

        .contact-form button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-form button:hover {
            background: #a67c52;
        }

        .contact-form button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #form-message {
            display: none;
            padding: 14px;
            margin-top: 18px;
            border-radius: 6px;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .contact-section {
                margin: 30px 15px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Riya Fashion Studio</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="collections.html">Collections</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <button class="menu-toggle" aria-label="Toggle navigation">
                ☰
            </button>
        </nav>
    </header>

    <main>

        <section class="contact-section">

            <h1>Contact Us</h1>

            <p>
                Have a question or want to know more about our collections?
                Send us a message. We'd love to hear from you!
            </p>

            <form id="contact-form" class="contact-form">

                <input
                    type="text"
                    name="name"
                    placeholder="Your Full Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Your Email Address"
                    required
                >

                <input
                    type="text"
                    name="subject"
                    placeholder="Subject"
                    required
                >

                <textarea
                    name="message"
                    placeholder="Write your message here..."
                    rows="6"
                    required
                ></textarea>

                <button type="submit" id="submit-btn">
                    Send Message
                </button>

                <div id="form-message" role="status" aria-live="polite"></div>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> Riya Fashion Studio. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
